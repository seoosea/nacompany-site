# 나컴퍼니 관리자 화면 설정
# 저장소: seoosea/nacompany-site

backend:
  name: github
  repo: seoosea/nacompany-site
  branch: main
  auth_methods: [token]
  commit_messages:
    create: "기사 추가: {{slug}}"
    update: "기사 수정: {{slug}}"
    delete: "기사 삭제: {{slug}}"
    uploadMedia: "사진 올림: {{path}}"
    deleteMedia: "사진 지움: {{path}}"

site_url: https://playsteam.co.kr
display_url: https://playsteam.co.kr

media_folder: src/assets/uploads
public_folder: /assets/uploads

# 사진을 올리면 자동으로 가로 1600px 이하, 가벼운 형식(webp)으로 줄여 저장합니다.
media_libraries:
  default:
    config:
      max_file_size: 20000000
      slugify_filename: true
      transformations:
        raster_image:
          format: webp
          quality: 82
          width: 1600

slug:
  encoding: unicode
  clean_accents: false

collections:
  # ───────────────────────── PLAYSTEAM 기사 ─────────────────────────
  - name: articles
    label: PLAYSTEAM 기사
    label_singular: 기사
    description: 기사를 쓰고 "공개"를 켠 채 저장하면 몇 분 뒤 홈페이지에 나타납니다.
    folder: src/playsteam/articles
    create: true
    extension: md
    format: frontmatter
    slug: "{{year}}{{month}}{{day}}-{{hour}}{{minute}}"
    preview_path: "playsteam/{{slug}}/"
    summary: "{{issue}} · {{title}}"
    sortable_fields: [date, title, issue]
    view_groups:
      - { label: 호수별, field: issue }
      - { label: 코너별, field: corner }
    fields:
      - { name: title, label: 제목, widget: string, maxlength: 24, hint: "24자 이내" }
      - name: issue
        label: 호수
        widget: string
        default: "2026 Vol.03"
        required: false
        hint: '이 기사를 묶을 호. 예: 2026 Vol.04 — 같은 호 기사는 글자를 똑같이 써 주세요. 비워 두면 첫 화면에만 나오고 호에는 들어가지 않습니다'
      - name: corner
        label: 코너
        widget: select
        options: ["What's New", "Special Class", "Editor's Pick", "Update"]
        default: "What's New"
      - name: category
        label: 분류
        widget: select
        options: [기관 교육, 교사 연수, 교육청, 행사 운영, 진로, 교육 기술, 대회, 수업, 학원 소식, 합격 소식, 이야기, Editor's Pick]
      - name: region
        label: 지역
        widget: select
        options: [울산, 대전, 충남, 온라인, 기타]
        required: false
      - { name: date, label: 날짜, widget: datetime, time_format: false, format: "YYYY-MM-DD" }
      - { name: published, label: 공개, widget: boolean, default: true, hint: "끄면 홈페이지에 보이지 않습니다 (임시 저장)" }
      - { name: pin, label: 1면에 올리기, widget: boolean, default: false, required: false, hint: "켜면 첫 화면 맨 위에 크게 나옵니다. 여러 개가 켜져 있으면 가장 최근 기사 하나만 올라갑니다" }
      - { name: pin_until, label: 1면 고정 마지막 날, widget: datetime, time_format: false, format: "YYYY-MM-DD", required: false, hint: "이 날이 지나면 저절로 내려가고 '나컴퍼니의 생각'이 다시 맨 위로 올라옵니다. 비워 두면 직접 끌 때까지 계속 올라가 있습니다" }
      - name: card
        label: 목록 사진 모양
        widget: select
        required: false
        default: ""
        hint: "첫 화면 벽돌에서 사진이 보이는 모양. 비워 두면 자동으로 섞입니다"
        options:
          - { label: "자동", value: "" }
          - { label: "세로로 길게 (4:5)", value: tall }
          - { label: "세로 (3:4)", value: portrait }
          - { label: "정사각형", value: square }
          - { label: "가로 (4:3)", value: wide }
          - { label: "가로로 길게 (16:10)", value: panorama }
      - name: group
        label: 첫 화면 자리
        widget: select
        required: false
        default: ""
        hint: "회사 소식은 첫 화면 위쪽, 학원 소식은 아래쪽에 모입니다. 자동이면 분류를 보고 정합니다 (기관 교육·교사 연수·교육청·행사 운영·진로·교육 기술 → 위쪽)"
        options:
          - { label: "자동", value: "" }
          - { label: "회사 소식 (위쪽)", value: company }
          - { label: "학원 · 대회 소식 (아래쪽)", value: academy }
      - { name: kind, label: 종류, widget: hidden, default: article }
      - { name: summary, label: 요약, widget: string, maxlength: 50, required: false, hint: "목록 카드에 보이는 한 줄 · 50자 이내" }
      - { name: pdf, label: 소식지 PDF (선택), widget: file, required: false, hint: "이 기사가 실린 소식지 PDF를 올리면 기사 아래에 버튼이 생깁니다" }
      - name: block
        label: 레이아웃과 내용
        widget: object
        typeKey: type
        hint: "레이아웃을 먼저 고르면, 그 레이아웃에 맞는 칸이 나타납니다"
        types:
          - name: big
            label: 큰 사진 — 대회 수상, 큰 행사
            widget: object
            fields:
              - name: photos
                label: 사진 (1장)
                widget: list
                min: 1
                max: 1
                fields:
                  - &src { name: src, label: 사진, widget: image }
                  - &focus { name: focus, label: 잘릴 때 보일 부분, widget: select, options: [{ label: 위, value: top }, { label: 가운데, value: center }, { label: 아래, value: bottom }], default: center, hint: "얼굴이 잘리면 바꿔 보세요" }
                  - &alt { name: alt, label: 사진 설명, widget: string, required: false, hint: "눈이 불편한 분과 검색엔진을 위한 한 줄 (예: 대회장에서 로봇을 조정하는 학생들)" }
              - { name: body, label: 본문, widget: text, maxlength: 400, hint: "400자 이내 · 빈 줄을 넣으면 새 문단" }
          - name: trio
            label: 사진 3장 — 행사 현장
            widget: object
            fields:
              - name: photos
                label: 사진 (3장)
                widget: list
                min: 3
                max: 3
                hint: "첫 번째 사진이 크게 보입니다"
                fields: [*src, *focus, *alt]
              - { name: body, label: 본문, widget: text, maxlength: 250, hint: "250자 이내" }
          - name: quote
            label: 인용문 — 참가자·학생의 한마디
            widget: object
            fields:
              - { name: quote, label: 인용문, widget: text, maxlength: 60, hint: "60자 이내" }
              - { name: quote_by, label: 말한 사람, widget: string, maxlength: 20, required: false }
              - name: photos
                label: 사진 (선택, 1장)
                widget: list
                required: false
                max: 1
                fields: [*src, *focus, *alt]
              - { name: body, label: 본문, widget: text, maxlength: 300, hint: "300자 이내" }
          - name: nums
            label: 숫자 강조 — 참가 인원, 운영 횟수
            widget: object
            fields:
              - name: stats
                label: 숫자 3개
                widget: list
                min: 3
                max: 3
                fields:
                  - { name: value, label: 숫자, widget: string, maxlength: 8, hint: "예: 150명" }
                  - { name: label, label: 설명, widget: string, maxlength: 10, hint: "예: 참가 종사자" }
              - name: photos
                label: 사진 (선택, 1장)
                widget: list
                required: false
                max: 1
                fields: [*src, *focus, *alt]
              - { name: body, label: 본문, widget: text, maxlength: 250, hint: "250자 이내" }
          - name: short
            label: 짧은 소식 — 개강, 공지
            widget: object
            fields:
              - { name: body, label: 본문, widget: text, maxlength: 150, hint: "150자 이내" }

  # ───────────────────────── 사이트 관리 ─────────────────────────
  - name: settings
    label: 사이트 관리
    description: 연락처, 링크, 실적처럼 가끔 바꾸는 내용
    files:
      - name: site
        label: 연락처 · 링크 · 슬로건
        file: src/_data/site.json
        format: json
        fields:
          - { name: name, label: 회사 이름, widget: string }
          - { name: url, label: 사이트 주소, widget: string, readonly: true }
          - { name: description, label: 검색 결과에 보일 회사 설명, widget: text, maxlength: 150 }
          - { name: keywords, label: 검색어, widget: string, hint: "쉼표로 구분 (예: 대전 교사 연수, 울산 AI 교육)" }
          - { name: slogan_line1, label: 첫 화면 슬로건 첫 줄, widget: string, maxlength: 20 }
          - { name: slogan_line2, label: 첫 화면 슬로건 둘째 줄, widget: string, maxlength: 20 }
          - { name: intro, label: 첫 화면 소개 글, widget: text, maxlength: 160 }
          - { name: services, label: 회사 소개 · 나컴퍼니가 하는 일, widget: list, required: false, hint: "한 줄에 하나씩. 회사 소개 페이지에 번호를 붙여 보여 줍니다", field: { name: service, label: 하는 일, widget: string, maxlength: 20 } }
          - { name: academy_url, label: 학원 사이트 주소, widget: string, required: false, hint: "비워 두면 '학원 바로가기' 버튼이 숨겨집니다" }
          - { name: lms_url, label: LMS 주소, widget: string, required: false }
          - { name: inquiry_form_url, label: 문의서 주소 (구글 설문지 등), widget: string, required: false, hint: "비워 두면 '문의서 작성하기' 버튼이 숨겨집니다" }
          - { name: newsletter_url, label: 소식지 구독 신청 주소 (스티비 등), widget: string, required: false, hint: "비워 두면 구독 칸이 숨겨집니다" }
          - { name: brochure_pdf, label: 회사 소개서 PDF, widget: file, required: false, hint: "올리면 '소개서 내려받기' 버튼이 생깁니다" }
          - name: hq
            label: 대전 본사
            widget: object
            fields:
              - { name: phone, label: 전화, widget: string, required: false }
              - { name: email, label: 메일, widget: string, required: false }
              - { name: address, label: 주소, widget: string, required: false }
          - name: center
            label: 울산 교육센터
            widget: object
            fields:
              - { name: phone, label: 전화, widget: string, required: false }
              - { name: email, label: 메일, widget: string, required: false }
              - { name: address, label: 주소, widget: string, required: false }
          - name: business
            label: 사업자 정보 (맨 아래 표시)
            widget: object
            fields:
              - { name: ceo, label: 대표자, widget: string, required: false }
              - { name: reg_no, label: 사업자등록번호, widget: string, required: false }
          - { name: naver_verification, label: 네이버 서치어드바이저 확인 코드, widget: string, required: false, hint: "네이버에서 받은 meta 태그의 content 값만 붙여 넣기" }
          - { name: google_verification, label: 구글 서치 콘솔 확인 코드, widget: string, required: false }

      - name: trends
        label: 첫 화면 '지금, 변화 읽기' (정책 · 사람 · 기술 소식)
        file: src/_data/trends.json
        format: json
        fields:
          - { name: title, label: 칸 제목, widget: string, maxlength: 16 }
          - { name: intro, label: 칸 설명, widget: text, maxlength: 80, required: false }
          - name: count
            label: 첫 화면에 몇 개 보일까요
            widget: select
            options: [{ label: "2개 (가로로 넓게)", value: 2 }, { label: "4개 (세로로 좁게)", value: 4 }]
            default: 2
          - name: items
            label: 소식
            widget: list
            required: false
            summary: "{{date}} · {{kind}} · {{title}}"
            hint: "'첫 화면에 고정'을 켠 소식이 먼저 나오고, 남는 자리는 최근 날짜순으로 채워집니다. 남의 기사를 옮기지 말고, 내 말로 짧게 줄인 뒤 원문 주소를 붙여 주세요. 비어 있으면 칸이 숨겨집니다"
            fields:
              - name: kind
                label: 종류
                widget: select
                options: [정책, 사람, 기술, 교육 현장, 숫자]
              - { name: pin, label: 첫 화면에 고정, widget: boolean, default: false, required: false, hint: "켜면 날짜와 상관없이 첫 화면에 나옵니다" }
              - { name: date, label: 날짜, widget: datetime, time_format: false, date_format: "YYYY.MM.DD", format: "YYYY-MM-DD" }
              - { name: image, label: 그림 (선택), widget: image, required: false, hint: "AI로 만든 그림이나 공공누리 사진. 실제 인물 얼굴·회사 로고는 넣지 마세요" }
              - { name: title, label: 제목, widget: string, maxlength: 26 }
              - { name: text, label: 한 줄 요약 (내 말로), widget: string, maxlength: 45 }
              - { name: quote, label: 인용 한마디 (사람 소식일 때), widget: string, maxlength: 40, required: false, hint: "실제로 한 말 그대로만. 출처 주소를 꼭 함께 넣어 주세요" }
              - { name: who, label: 누가 (이름 · 직함), widget: string, maxlength: 30, required: false }
              - { name: source, label: 출처 이름, widget: string, maxlength: 20, hint: "예: 교육부 보도자료, ○○일보" }
              - { name: url, label: 원문 주소, widget: string }

      - name: audiences
        label: 회사 소개 · 대상별 세 가지 힘 (교사 · 기관 · 기업)
        file: src/_data/audiences.json
        format: json
        fields:
          - name: items
            label: 대상
            widget: list
            summary: "{{name}}"
            hint: "학생 대상 내용은 PLAYSTEAM 기사의 철학 글에서 고칩니다. 여기는 그 밖의 대상입니다"
            fields:
              - { name: name, label: 대상 이름, widget: string, maxlength: 10 }
              - { name: ask, label: 묻는 힘, widget: text, maxlength: 60 }
              - { name: judge, label: 판단하는 힘, widget: text, maxlength: 60 }
              - { name: do, label: 해내는 힘, widget: text, maxlength: 60 }

      - name: boxes
        label: 첫 화면 정보 칸 (교육 의뢰 · 구독 등)
        file: src/_data/boxes.json
        format: json
        fields:
          - name: items
            label: 정보 칸
            widget: list
            summary: "{{position}}번째 · {{label}}"
            hint: "기사 사이에 끼워 넣는 색 칸입니다. 2~3개가 적당합니다"
            fields:
              - { name: position, label: 몇 번째 기사 앞에 넣을까요, widget: number, value_type: int, min: 1, default: 5 }
              - name: color
                label: 색
                widget: select
                options: [{ label: 산호색, value: coral }, { label: 남색, value: deep }, { label: 하늘색, value: blue }, { label: 흰색, value: white }, { label: 검정(ROOTA), value: ink }]
              - { name: label, label: 작은 제목, widget: string, maxlength: 16 }
              - { name: title, label: 큰 제목, widget: text, maxlength: 30, hint: "줄을 바꾸면 그대로 줄이 바뀝니다" }
              - { name: lines, label: 목록, widget: list, required: false, field: { name: line, label: 한 줄, widget: string, maxlength: 20 } }
              - { name: link_text, label: 버튼 글자, widget: string, maxlength: 14 }
              - { name: link, label: 연결할 주소, widget: string, hint: "예: /programs/ · 구독 칸은 subscribe 라고 쓰면 사이트 관리의 구독 주소로 연결됩니다 (구독 주소가 비어 있으면 칸이 숨겨집니다)" }
      - name: programs
        label: 맡길 수 있는 교육 · 의뢰 방법
        file: src/_data/programs.json
        format: json
        fields:
          - { name: intro, label: 안내 문장, widget: text, maxlength: 80 }
          - name: items
            label: 교육 프로그램
            widget: list
            summary: "{{title}}"
            fields:
              - { name: title, label: 이름, widget: string, maxlength: 20 }
              - { name: who, label: 대상, widget: string, maxlength: 24 }
              - { name: text, label: 설명, widget: text, maxlength: 90 }
              - { name: form, label: 운영 형태, widget: string, maxlength: 30, required: false }
              - { name: proof, label: 운영 사례, widget: string, maxlength: 50, required: false }
          - name: steps
            label: 의뢰 순서
            widget: list
            min: 3
            max: 3
            fields:
              - { name: title, label: 제목, widget: string, maxlength: 14 }
              - { name: text, label: 설명, widget: text, maxlength: 60 }
